site_name: 無名研究牲
theme:
  name: material
  language: zh-Hant # 設定為繁體中文
  palette:
    # 設定自動切換深色/淺色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs # 讓導覽列變成上方標籤

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首頁: index.md
  - 論文研讀與實作:
      - 隨機規劃 (Stochastic Programming): paper/stochastic_pro.md
      - 大規模優化演算法: paper/large_scale_opt.md
  - 量化交易專案:
      - 回測系統實作: projects/backtest.md
      - 因子研究: projects/factor_research.md
  - 程式與開發:
      - Web 開發心得: coding/web_dev.md
      - Python 技巧: coding/python_tips.md
  - 靈感與雜記: misc/ideas.md
  - 關於我: about.md
